services:
  peak-assign:
    build: .
    image: peak-assign:latest
    container_name: peak-assign
    ports:
      - "8000:8000"
    environment:
      # 可复核批次的 SQLite 数据库路径（位于下方持久卷内，重启不丢）
      BATCH_DB_PATH: /data/batches.db
    volumes:
      - peak-assign-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  peak-assign-data:
